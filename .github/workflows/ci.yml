name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public content privacy
        run: npm run privacy:check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Web build
        run: npm run export:web

  # Playwright end-to-end tests on the web build (e2e/web). A separate job, so unit checks stay
  # fast and a failed browser test is easy to spot on the pull request.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's Playwright image already has Chromium and the Linux packages it needs, so there
    # is no browser install step. The tag must match @playwright/test in package.json
    # (src/config/ci.test.ts checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end tests
        run: npm run e2e
      # The HTML report, with traces and screenshots, downloadable from the run when a test fails.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
